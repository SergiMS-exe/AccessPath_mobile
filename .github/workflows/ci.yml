name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile Kotlin (Android target)
        run: ./gradlew :composeApp:compileKotlinAndroid --no-daemon

      - name: Compile Kotlin (iOS targets)
        # Los targets iOS solo se compilan en macOS; en Linux se saltan sin error.
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --no-daemon || true

      - name: Run tests
        run: ./gradlew :composeApp:test --no-daemon

      - name: Verify BuildKonfig can resolve
        # El skill explica: API_BASE_URL es OBLIGATORIO en local.properties para
        # que la build pase. Aqui definimos un placeholder para que el test de
        # integracion verifique que el plugin buildkonfig no rompe la build.
        run: |
          echo "API_BASE_URL=https://example.com" >> local.properties
          echo "MAPS_API_KEY=" >> local.properties
          ./gradlew :composeApp:generateBuildKonfig --no-daemon
